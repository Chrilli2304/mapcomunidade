function MapSurface({ filters, onSelectBusiness, onSelectRoad, recentReports, density }) {
  const [view] = React.useState({ x:340, y:400, zoom:2.8 });
  const [activeReport, setActiveReport] = React.useState(null);
  const viewRef = React.useRef(view);
  const viewFrameRef = React.useRef(null);
  const svgRef = React.useRef(null);
  const rectRef = React.useRef(null);
  const dragRef = React.useRef(null);
  const containerRef = React.useRef(null);
  const clamp = (v,mn,mx) => Math.max(mn,Math.min(mx,v));

  const cap = React.useMemo(() => Math.floor(ALL_BUILDINGS.length * Math.min(1, 0.65 + density*0.35)), [density]);
  const visBuildings = React.useMemo(() => ALL_BUILDINGS.slice(0, cap), [cap]);
  const favelaBuildings = React.useMemo(() => visBuildings.filter(b => b.type === 'favela'), [visBuildings]);
  const outerBuildings = React.useMemo(() => visBuildings.filter(b => b.type !== 'favela'), [visBuildings]);
  const visRoads = React.useMemo(() => ROADS.filter(r => {
    if (r.status==='passable'&&!filters.passable) return false;
    if (r.status==='blocked'&&!filters.blocked)   return false;
    if (r.status==='foot'&&!filters.foot)          return false;
    return true;
  }), [filters.passable, filters.blocked, filters.foot]);
  const favelaRoads = React.useMemo(() => visRoads.filter(r => FAVELA_ROAD_IDS.has(r.id)), [visRoads]);
  const outerRoads = React.useMemo(() => visRoads.filter(r => !FAVELA_ROAD_IDS.has(r.id)), [visRoads]);
  const visBiz = filters.business ? BUSINESSES : [];

  // Batch buildings by colour group: 8 <path> elements instead of ~10k
  const outerBatch = React.useMemo(() => {
    const g = {ol:[],od:[],ml:[],md:[]};
    for (const b of outerBuildings) {
      const k = b.type==='morumbi' ? (b.shade<0.5?'ml':'md') : (b.shade<0.5?'ol':'od');
      g[k].push(b.pathStr);
    }
    return {ol:g.ol.join(' '),od:g.od.join(' '),ml:g.ml.join(' '),md:g.md.join(' ')};
  }, [outerBuildings]);
  const favelaBatch = React.useMemo(() => {
    const g = {f0:[],f1:[],f2:[],f3:[]};
    for (const b of favelaBuildings) {
      const k = b.shade<0.25?'f0':b.shade<0.5?'f1':b.shade<0.75?'f2':'f3';
      g[k].push(b.pathStr);
    }
    return {f0:g.f0.join(' '),f1:g.f1.join(' '),f2:g.f2.join(' '),f3:g.f3.join(' ')};
  }, [favelaBuildings]);

  const springRef = React.useRef(null);

  React.useEffect(() => () => {
    if (viewFrameRef.current) cancelAnimationFrame(viewFrameRef.current);
    if (springRef.current) cancelAnimationFrame(springRef.current);
  }, []);

  const applyTransform = React.useCallback((v) => {
    const svg = svgRef.current, rect = rectRef.current;
    if (!svg || !rect) return;
    const s = rect.width * v.zoom / MAP_W;
    svg.style.transform = `translate(${(-v.x * s).toFixed(2)}px,${(-v.y * s).toFixed(2)}px) scale(${s.toFixed(6)})`;
  }, []);

  // Re-apply transform after any React render (e.g. density/filter change)
  React.useLayoutEffect(() => { applyTransform(viewRef.current); });

  const validBounds = (zoom) => ({
    minX:0, maxX:Math.max(0, MAP_W - MAP_W/zoom),
    minY:0, maxY:Math.max(0, MAP_H - MAP_H/zoom),
  });

  const cancelSpring = () => {
    if (springRef.current) { cancelAnimationFrame(springRef.current); springRef.current = null; }
  };

  const commitView = (next) => {
    viewRef.current = next;
    if (viewFrameRef.current) return;
    viewFrameRef.current = requestAnimationFrame(() => {
      viewFrameRef.current = null;
      applyTransform(viewRef.current);
    });
  };

  const springTo = (tx, ty) => {
    cancelSpring();
    const step = () => {
      const cur = viewRef.current;
      const dx = tx - cur.x, dy = ty - cur.y;
      if (Math.abs(dx) < 0.4 && Math.abs(dy) < 0.4) {
        springRef.current = null;
        viewRef.current = {...cur, x:tx, y:ty};
      } else {
        viewRef.current = {...cur, x: cur.x + dx*0.22, y: cur.y + dy*0.22};
        springRef.current = requestAnimationFrame(step);
      }
      applyTransform(viewRef.current);
    };
    springRef.current = requestAnimationFrame(step);
  };

  const onPointerDown = e => {
    cancelSpring();
    e.currentTarget.setPointerCapture(e.pointerId);
    const cur = viewRef.current;
    dragRef.current = {x:e.clientX,y:e.clientY,vx:cur.x,vy:cur.y,zoom:cur.zoom};
  };
  const onPointerMove = e => {
    if (!dragRef.current) return;
    const rect = rectRef.current;
    const zoom = dragRef.current.zoom || viewRef.current.zoom;
    const sx=(MAP_W/zoom)/rect.width, sy=(MAP_H/zoom)/rect.height;
    const rawX = dragRef.current.vx-(e.clientX-dragRef.current.x)*sx;
    const rawY = dragRef.current.vy-(e.clientY-dragRef.current.y)*sy;
    const {minX,maxX,minY,maxY} = validBounds(zoom);
    const rb = (v,lo,hi) => v<lo ? lo+(v-lo)*0.3 : v>hi ? hi+(v-hi)*0.3 : v;
    commitView({...viewRef.current, x:rb(rawX,minX,maxX), y:rb(rawY,minY,maxY)});
  };
  const onPointerUp = () => {
    if (!dragRef.current) return;
    dragRef.current = null;
    const cur = viewRef.current;
    const {minX,maxX,minY,maxY} = validBounds(cur.zoom);
    const tx = clamp(cur.x, minX, maxX), ty = clamp(cur.y, minY, maxY);
    if (Math.abs(tx-cur.x) > 0.5 || Math.abs(ty-cur.y) > 0.5) springTo(tx, ty);
  };
  const onWheel = React.useCallback(e => {
    cancelSpring();
    e.preventDefault();
    const cur = viewRef.current;
    const rect = rectRef.current;
    const isMouseWheel = e.deltaMode === 1 || (Math.abs(e.deltaY) >= 48 && Math.abs(e.deltaX) < 2);
    if (e.ctrlKey || isMouseWheel) {
      const nz=clamp(cur.zoom*Math.exp(-e.deltaY*0.0012),0.5,5);
      const {minX,maxX,minY,maxY}=validBounds(nz);
      commitView({...cur, zoom:nz, x:clamp(cur.x,minX,maxX), y:clamp(cur.y,minY,maxY)});
      return;
    }
    const sx=(MAP_W/cur.zoom)/rect.width, sy=(MAP_H/cur.zoom)/rect.height;
    const {minX,maxX,minY,maxY}=validBounds(cur.zoom);
    commitView({...cur, x:clamp(cur.x+e.deltaX*sx,minX,maxX), y:clamp(cur.y+e.deltaY*sy,minY,maxY)});
  }, []);

  // Initialize rect, apply first transform, register native wheel listener (needs passive:false)
  React.useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const updateRect = () => {
      rectRef.current = el.getBoundingClientRect();
      applyTransform(viewRef.current);
    };
    updateRect();
    el.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('resize', updateRect);
    return () => {
      el.removeEventListener('wheel', onWheel);
      window.removeEventListener('resize', updateRect);
    };
  }, []);

  const zoomBy = f=>{
    cancelSpring();
    const cur = viewRef.current;
    const nz=clamp(cur.zoom*f,0.5,5);
    const {minX,maxX,minY,maxY}=validBounds(nz);
    commitView({...cur, zoom:nz, x:clamp(cur.x,minX,maxX), y:clamp(cur.y,minY,maxY)});
  };

  const bFill = b=>{
    if (b.type==='morumbi') return b.shade<0.5?'#D4D9E2':'#CDD4DE';
    if (b.type==='outer')   return b.shade<0.5?'#C4C2BC':'#BBBAB2';
    if (b.shade<0.25) return '#E2C8A8';
    if (b.shade<0.5)  return '#D9BBA0';
    if (b.shade<0.75) return '#CDAA88';
    return '#C49A78';
  };
  const bStroke = b=>{
    if (b.type==='morumbi') return '#B0BBC8';
    if (b.type==='outer')   return '#BEB8A8';
    return MAP_COLORS.favelaBuildOutline;
  };
  const roadD = (r) => {
    if (!FAVELA_ROAD_IDS.has(r.id)) return r.d;
    const s = ROAD_DEF_BY_ID[r.id];
    if (!s) return r.d;
    const extend = 60;
    const startLen = Math.hypot(s.bx-s.ax, s.by-s.ay) || 1;
    const endLen = Math.hypot(s.dx-s.cx, s.dy-s.cy) || 1;
    const ax = s.ax - ((s.bx-s.ax)/startLen)*extend;
    const ay = s.ay - ((s.by-s.ay)/startLen)*extend;
    const dx = s.dx + ((s.dx-s.cx)/endLen)*extend;
    const dy = s.dy + ((s.dy-s.cy)/endLen)*extend;
    return `M ${ax} ${ay} C ${s.bx} ${s.by}, ${s.cx} ${s.cy}, ${dx} ${dy}`;
  };
  const renderRoadShadows = (roads) => roads.map(r=>
    <path key={`rs${r.id}`} d={roadD(r)} stroke="#000" strokeWidth={r.width+2} fill="none" strokeLinecap="round" strokeLinejoin="round" transform="translate(0.3,1.1)"/>
  );
  const renderCasings = (roads) => roads.filter(r=>r.status!=='foot').map(r=>(
    <path key={`rc${r.id}`} d={roadD(r)} stroke="#FFF" strokeWidth={r.width+2.2} fill="none" strokeLinecap="butt" strokeLinejoin="round"/>
  ));
  const renderRoads = (roads) => roads.map(r=>{
    const col = r.isStair ? MAP_COLORS.staircase
              : r.status==='passable' ? MAP_COLORS.passable
              : r.status==='blocked'  ? MAP_COLORS.blocked
              : MAP_COLORS.footOnly;
    const dash = (!r.isStair && r.status==='foot') ? `${r.width*2} ${r.width*1.5}` : 'none';
    return (
      <g key={r.id} style={{cursor:'pointer'}} onClick={e=>{e.stopPropagation();onSelectRoad?.(r);}}>
        <path d={roadD(r)} stroke={col} strokeWidth={r.width} strokeDasharray={dash} fill="none" strokeLinecap="butt" strokeLinejoin="round"/>
        {r.isStair&&<path d={roadD(r)} stroke={col} strokeWidth={r.width+8} strokeDasharray={`1.5 ${r.width+3}`} fill="none" strokeLinecap="butt" opacity="0.88"/>}
        <path d={roadD(r)} stroke="transparent" strokeWidth={r.width+14} fill="none"/>
      </g>
    );
  });

  return (
    <div ref={containerRef}
      style={{position:'absolute',inset:0,overflow:'hidden',background:MAP_COLORS.bgSand,touchAction:'none',cursor:'grab'}}
      onPointerDown={onPointerDown} onPointerMove={onPointerMove}
      onPointerUp={onPointerUp} onPointerCancel={onPointerUp}>
      <svg ref={svgRef} viewBox={`0 0 ${MAP_W} ${MAP_H}`}
           style={{position:'absolute',top:0,left:0,width:MAP_W,height:MAP_H,
                   transformOrigin:'0 0',willChange:'transform',display:'block'}}>
        <defs>
          <pattern id="mapgrid" width="100" height="100" patternUnits="userSpaceOnUse">
            <path d="M100 0L0 0 0 100" fill="none" stroke="rgba(150,130,90,0.05)" strokeWidth="0.5"/>
          </pattern>
          <filter id="bldSh" x="-15%" y="-15%" width="130%" height="130%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="0.8"/>
            <feOffset dx="0.3" dy="1" result="b"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="pinSh" x="-30%" y="-20%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="favelaClip">
            <polygon points={FAVELA_POLY.map(([x,y])=>`${x},${y}`).join(' ')}/>
          </clipPath>
          <mask id="outsideFavelaMask" maskUnits="userSpaceOnUse" x="-200" y="-200" width={MAP_W+400} height={MAP_H+400}>
            <rect x="-200" y="-200" width={MAP_W+400} height={MAP_H+400} fill="#fff"/>
            <polygon points={FAVELA_POLY.map(([x,y])=>`${x},${y}`).join(' ')} fill="#000" stroke="#000" strokeWidth="9" strokeLinejoin="round"/>
          </mask>
          <radialGradient id="pulseG" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor={MAP_COLORS.myPin} stopOpacity="0.5"/>
            <stop offset="100%" stopColor={MAP_COLORS.myPin} stopOpacity="0"/>
          </radialGradient>
          <radialGradient id="lakeG" cx="40%" cy="38%" r="60%">
            <stop offset="0%" stopColor="#C8E0EE"/>
            <stop offset="100%" stopColor={MAP_COLORS.lake}/>
          </radialGradient>
          <path id="pgronchi" d="M862 60C863 400,858 800,852 1400"/>
          <path id="pgalup"   d="M640 295C718 545,592 888,638 1388"/>
          <path id="phebe"    d="M485 248C418 520,558 900,492 1388"/>
          <path id="pirat"    d="M338 320C272 610,378 960,318 1385"/>
          <path id="prenan"   d="M312 370C432 298,598 348,712 290"/>
          <path id="pitaoca"  d="M285 540C418 612,582 488,732 568"/>
          <path id="pmelch"   d="M285 778C445 742,578 822,742 778"/>
          <path id="pdiag1"   d="M462 348C572 440,658 565,728 685"/>
          <path id="pdiag2"   d="M718 395C648 498,545 628,478 745"/>
          <path id="pcon1"    d="M392 258C382 382,375 505,368 628"/>
          <path id="pcon2"    d="M574 288C590 412,602 542,615 665"/>
        </defs>

        <rect x="-200" y="-200" width={MAP_W+400} height={MAP_H+400} fill={MAP_COLORS.bgSand}/>
        <rect x="-200" y="-200" width={MAP_W+400} height={MAP_H+400} fill="url(#mapgrid)" opacity="0.9"/>

        {/* Morumbi zone tint */}
        <polygon points="0,0 310,0 310,300 260,375 255,440 248,600 150,600 80,550 30,480 0,400" fill="#ECEAE4" opacity="0.45"/>
        <polygon points="0,400 80,550 150,600 200,700 160,800 80,780 0,720" fill="#ECEAE4" opacity="0.45"/>

        {/* Parks */}
        {PARK_PATHS.map((d,i)=><path key={`pk${i}`} d={d} fill={MAP_COLORS.park} stroke={MAP_COLORS.parkEdge} strokeWidth="1"/>)}

        {/* Trees */}
        {TREES.map((t,i)=><circle key={`tr${i}`} cx={t.x} cy={t.y} r={t.r2||3} fill={t.park?'#78A858':'#8AB870'} opacity={t.park?0.62:0.42}/>)}

        {/* Morumbi parcels */}
        {MORUMBI_PARCELS.map((p,i)=><rect key={`mp${i}`} x={p.x} y={p.y} width={p.w} height={p.h} rx="2" fill={MAP_COLORS.morumbiYard} stroke="#9AB888" strokeWidth="0.7" opacity="0.55"/>)}

        {/* Highways */}
        {HIGHWAYS.map(h=><path key={`hc${h.id}`} d={h.d} stroke={MAP_COLORS.highwayEdge} strokeWidth={h.width+3} fill="none" strokeLinecap="round" strokeLinejoin="round"/>)}
        {HIGHWAYS.map(h=><path key={`hf${h.id}`} d={h.d} stroke={MAP_COLORS.highway} strokeWidth={h.width} fill="none" strokeLinecap="round" strokeLinejoin="round"/>)}
        <path d="M862 0C863 400,858 800,852 1600" stroke="#fff" strokeWidth="1.1" strokeDasharray="16 9" fill="none" opacity="0.4"/>

        {/* Favela background — hard-clipped community zone */}
        <polygon points={FAVELA_POLY.map(([x,y])=>`${x},${y}`).join(' ')} fill="#EAD8BE" opacity="0.55"/>

        {/* Buildings — outside and favela layers cannot bleed into each other */}
        {/* Buildings — 8 batched paths instead of ~10k individual elements */}
        <g mask="url(#outsideFavelaMask)">
          {outerBatch.ol&&<path d={outerBatch.ol} fill="#C4C2BC" stroke="#BEB8A8" strokeWidth="0.45" opacity="0.94"/>}
          {outerBatch.od&&<path d={outerBatch.od} fill="#BBBAB2" stroke="#BEB8A8" strokeWidth="0.45" opacity="0.94"/>}
          {outerBatch.ml&&<path d={outerBatch.ml} fill="#D4D9E2" stroke="#B0BBC8" strokeWidth="0.45" opacity="0.94"/>}
          {outerBatch.md&&<path d={outerBatch.md} fill="#CDD4DE" stroke="#B0BBC8" strokeWidth="0.45" opacity="0.94"/>}
        </g>
        <g clipPath="url(#favelaClip)">
          {favelaBatch.f0&&<path d={favelaBatch.f0} fill="#E2C8A8" stroke="#C4A882" strokeWidth="0.45" opacity="0.94"/>}
          {favelaBatch.f1&&<path d={favelaBatch.f1} fill="#D9BBA0" stroke="#C4A882" strokeWidth="0.45" opacity="0.94"/>}
          {favelaBatch.f2&&<path d={favelaBatch.f2} fill="#CDAA88" stroke="#C4A882" strokeWidth="0.45" opacity="0.94"/>}
          {favelaBatch.f3&&<path d={favelaBatch.f3} fill="#C49A78" stroke="#C4A882" strokeWidth="0.45" opacity="0.94"/>}
        </g>

        {/* Road shadows */}
        <g opacity="0.06" mask="url(#outsideFavelaMask)">
          {renderRoadShadows(outerRoads)}
        </g>
        <g opacity="0.06" clipPath="url(#favelaClip)">
          {renderRoadShadows(favelaRoads)}
        </g>

        {/* Road casings — white backing makes roads fully opaque */}
        <g mask="url(#outsideFavelaMask)">
          {renderCasings(outerRoads)}
        </g>
        <g clipPath="url(#favelaClip)">
          {renderCasings(favelaRoads)}
        </g>

        {/* Roads */}
        <g mask="url(#outsideFavelaMask)">
          {renderRoads(outerRoads)}
        </g>
        <g clipPath="url(#favelaClip)">
          {renderRoads(favelaRoads)}
        </g>

        {/* Boundary is the visual cut line between zones */}
        <polygon points={FAVELA_POLY.map(([x,y])=>`${x},${y}`).join(' ')}
          fill="none" stroke="#6F6251" strokeWidth="3.2" strokeDasharray="8 6" opacity="0.72" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>

        {/* Lake — rendered AFTER roads so it covers road segments passing through it */}
        <path d={LAKE_PATH} fill="url(#lakeG)" stroke={MAP_COLORS.lakeEdge} strokeWidth="1.1" opacity="0.98"/>
        <ellipse cx="408" cy="1128" rx="20" ry="9" fill="none" stroke={MAP_COLORS.lakeRipple} strokeWidth="0.7" opacity="0.38"/>

        {/* Street labels */}
        <g style={{pointerEvents:'none'}} fontFamily="Inter,sans-serif" fontSize="8" fill={MAP_COLORS.labelMuted} letterSpacing="0.3">
          <text><textPath href="#pgronchi" startOffset="12%">Av. Giovanni Gronchi</textPath></text>
          <text><textPath href="#pgalup"   startOffset="18%">R. Pasquale Galuppi</textPath></text>
          <text><textPath href="#phebe"    startOffset="22%">R. Hebe Camargo</textPath></text>
          <text><textPath href="#pirat"    startOffset="18%">R. Iratinga</textPath></text>
          <text><textPath href="#prenan"   startOffset="12%">R. Ernest Renan</textPath></text>
          <text><textPath href="#pitaoca"  startOffset="12%">R. Itaóca</textPath></text>
          <text><textPath href="#pmelch"   startOffset="14%">R. Melchior Giola</textPath></text>
          <text><textPath href="#pdiag1"   startOffset="10%">R. da Encosta</textPath></text>
          <text><textPath href="#pdiag2"   startOffset="10%">Travessa do Morro</textPath></text>
          <text><textPath href="#pcon1"    startOffset="14%">R. Cruzeiro</textPath></text>
          <text><textPath href="#pcon2"    startOffset="14%">R. do Mirante</textPath></text>
        </g>

        {/* Beco labels */}
        <g style={{pointerEvents:'none'}} fontFamily="Inter,sans-serif" fontSize="7" fill={MAP_COLORS.footOnly} opacity="0.72">
          <text x="444" y="502" transform="rotate(72,444,502)">Beco do Sapo</text>
          <text x="553" y="565" transform="rotate(76,553,565)">Beco da Antônia</text>
          <text x="396" y="912" transform="rotate(78,396,912)">Viela 7</text>
          <text x="468" y="698" transform="rotate(74,468,698)">Beco das Flores</text>
          <text x="610" y="818" transform="rotate(76,610,818)">Beco da Escola</text>
          <text x="525" y="882" transform="rotate(78,525,882)">Viela Curva</text>
          <text x="356" y="522" transform="rotate(78,356,522)">Beco da Pedra</text>
        </g>

        {/* Live report pulses */}
        {recentReports.map(rep=>(
          <g key={rep.id} style={{cursor:'pointer'}} onClick={e=>{e.stopPropagation();setActiveReport(r=>r&&r.id===rep.id?null:rep);}}>
            <circle cx={rep.x} cy={rep.y} r="18" fill={rep.color} opacity="0.14">
              <animate attributeName="r" values="12;30;12" dur="2.4s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.28;0;0.28" dur="2.4s" repeatCount="indefinite"/>
            </circle>
            <circle cx={rep.x} cy={rep.y} r="5" fill={rep.color} stroke="#fff" strokeWidth="1.6"/>
          </g>
        ))}

        {/* Business pins */}
        {visBiz.map(b=>(
          <g key={b.id} style={{cursor:'pointer',filter:'url(#pinSh)'}}
             onClick={e=>{e.stopPropagation();onSelectBusiness?.(b);}}>
            <path d={`M${b.x} ${b.y-24}C${b.x-12} ${b.y-24} ${b.x-12} ${b.y-8} ${b.x} ${b.y+2}C${b.x+12} ${b.y-8} ${b.x+12} ${b.y-24} ${b.x} ${b.y-24}Z`}
              fill={MAP_COLORS.business} stroke="#fff" strokeWidth="1.5"/>
            <circle cx={b.x} cy={b.y-15} r="3.5" fill="#F7F4EF"/>
            {!b.verified&&<circle cx={b.x+9} cy={b.y-24} r="3.8" fill={MAP_COLORS.footOnly} stroke="#fff" strokeWidth="1"/>}
          </g>
        ))}

        {/* User location */}
        <circle cx={MY_LOCATION.x} cy={MY_LOCATION.y} r="40" fill="url(#pulseG)">
          <animate attributeName="r" values="16;44;16" dur="2.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.65;0;0.65" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx={MY_LOCATION.x} cy={MY_LOCATION.y} r="14" fill="#fff"/>
        <circle cx={MY_LOCATION.x} cy={MY_LOCATION.y} r="9" fill={MAP_COLORS.myPin}/>
        <circle cx={MY_LOCATION.x} cy={MY_LOCATION.y} r="9" fill="none" stroke="#fff" strokeWidth="1.5"/>

        {/* Neighbourhood labels */}
        <g style={{pointerEvents:'none'}} fontFamily="Inter,sans-serif">
          <text x="492" y="810" textAnchor="middle" fontSize="13" fontWeight="700" fill="#6A5030" letterSpacing="4" opacity="0.48">PARAÍSOPOLIS</text>
          <text x="128" y="342" textAnchor="middle" fontSize="11" fontWeight="700" fill={MAP_COLORS.labelMuted} letterSpacing="3">MORUMBI</text>
          <text x="128" y="615" textAnchor="middle" fontSize="10" fontWeight="700" fill={MAP_COLORS.labelMuted} letterSpacing="2.5">VILA ANDRADE</text>
          <text x="920" y="378" textAnchor="middle" fontSize="9" fontWeight="700" fill={MAP_COLORS.labelMuted} letterSpacing="2">CAMPO BELO</text>
          <text x="415" y="1146" textAnchor="middle" fontSize="9" fontStyle="italic" fill={MAP_COLORS.waterLabel} opacity="0.88">Lago Guaraciaúva</text>
          <text x="492" y="636" textAnchor="middle" fontSize="7.5" fontWeight="600" fill={MAP_COLORS.labelMuted}>Praça da Coordenação</text>
        </g>

        {/* Scale bar */}
        <g style={{pointerEvents:'none'}} transform="translate(28,1555)">
          <rect width="80" height="14" rx="4" fill="rgba(255,255,255,0.72)"/>
          <line x1="5" y1="9" x2="75" y2="9" stroke={MAP_COLORS.labelDark} strokeWidth="1.4"/>
          <line x1="5" y1="5" x2="5" y2="13" stroke={MAP_COLORS.labelDark} strokeWidth="1.4"/>
          <line x1="75" y1="5" x2="75" y2="13" stroke={MAP_COLORS.labelDark} strokeWidth="1.4"/>
          <text x="40" y="8" textAnchor="middle" fontSize="7" fill={MAP_COLORS.labelDark} fontFamily="Inter,sans-serif" fontWeight="600">200 m</text>
        </g>

        {/* North arrow */}
        <g style={{pointerEvents:'none'}} transform="translate(942,1540)">
          <circle r="17" fill="rgba(255,255,255,0.75)" stroke={MAP_COLORS.blockOutline} strokeWidth="0.7"/>
          <path d="M0-12L4 4L0 2L-4 4Z" fill={MAP_COLORS.labelDark}/>
          <path d="M0 12L4-4L0-2L-4-4Z" fill={MAP_COLORS.labelMuted}/>
          <text y="1" textAnchor="middle" fontSize="7" fontWeight="700" fill={MAP_COLORS.labelDark} fontFamily="Inter,sans-serif">N</text>
        </g>

        {/* Address numbers */}
        <g style={{pointerEvents:'none'}} fontFamily="Inter,sans-serif" fontSize="6.5" fill={MAP_COLORS.labelMuted} opacity="0.58">
          <text x="645" y="290">412</text>
          <text x="862" y="185">1180</text>
          <text x="330" y="344">230</text>
        </g>
      </svg>

      {/* Report pulse tooltip */}
      {activeReport && (() => {
        const contEl = containerRef.current;
        if (!contEl || !rectRef.current) return null;
        const v = viewRef.current;
        const s = rectRef.current.width * v.zoom / MAP_W;
        const px = s * (activeReport.x - v.x);
        const py = s * (activeReport.y - v.y);
        const cw = contEl.clientWidth;
        const tipW = 160, tipH = 54;
        const tx = Math.min(Math.max(px - tipW/2, 6), cw - tipW - 6);
        const above = py - tipH - 14 >= 4;
        const ty = above ? py - tipH - 14 : py + 14;
        return (
          <div style={{
            position:'absolute', left: tx, top: ty,
            width: tipW, background:'#1F4D2E', color:'#fff',
            borderRadius:10, padding:'8px 12px', pointerEvents:'none',
            boxShadow:'0 4px 16px rgba(0,0,0,0.28)', zIndex:20,
          }}>
            <div style={{fontSize:12,fontWeight:700,lineHeight:1.3}}>{activeReport.label}</div>
            <div style={{fontSize:11,opacity:0.72,marginTop:2}}>{activeReport.time}</div>
            <div style={{
              position:'absolute', left: Math.min(Math.max(px-tx-5,8), tipW-18),
              [above?'bottom':'top']:-5,
              width:10, height:10, background:'#1F4D2E',
              transform:'rotate(45deg)', borderRadius:2,
            }}/>
          </div>
        );
      })()}

      {/* Zoom controls */}
      <div style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',
        display:'flex',flexDirection:'column',gap:4,background:'#fff',borderRadius:12,
        boxShadow:'0 2px 10px rgba(0,0,0,0.12)',overflow:'hidden',zIndex:5}}>
        <button onClick={()=>zoomBy(1.3)} style={{width:40,height:36,border:'none',background:'#fff',fontSize:22,fontWeight:600,color:'#1F4D2E',cursor:'pointer',lineHeight:1}}>＋</button>
        <div style={{height:1,background:'#EAE6DD'}}/>
        <button onClick={()=>zoomBy(1/1.3)} style={{width:40,height:36,border:'none',background:'#fff',fontSize:22,fontWeight:600,color:'#1F4D2E',cursor:'pointer',lineHeight:1}}>－</button>
      </div>

    </div>
  );
}

function makeFakeQR(seed) {
  const s = rng(seed | 0);
  const N = 21;
  const g = Array.from({length:N}, () => Array(N).fill(0));
  const finder = (r,c) => {
    for (let dr=0;dr<7;dr++) for (let dc=0;dc<7;dc++)
      g[r+dr][c+dc] = (dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)) ? 1 : 0;
  };
  finder(0,0); finder(0,14); finder(14,0);
  for (let i=8;i<13;i++) { g[6][i]=i%2===0?1:0; g[i][6]=i%2===0?1:0; }
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) {
    if (g[r][c]!==0) continue;
    if (!((r<9&&c<9)||(r<9&&c>12)||(r>12&&c<9))) g[r][c]=s()>0.5?1:0;
  }
  return g;
}

function QRCode({ seed, size=190 }) {
  const grid = React.useMemo(() => makeFakeQR(seed), [seed]);
  const N = grid.length, cell = size/N;
  const rects = [];
  for (let r=0;r<N;r++) for (let c=0;c<N;c++)
    if (grid[r][c]) rects.push(`M${(c*cell).toFixed(1)} ${(r*cell).toFixed(1)}h${cell.toFixed(1)}v${cell.toFixed(1)}H${(c*cell).toFixed(1)}Z`);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
      <rect width={size} height={size} fill="#fff"/>
      <path d={rects.join(' ')} fill="#111"/>
    </svg>
  );
}

function OnboardingView({ onDone }) {
  const [step, setStep] = React.useState(0);
  const slides = [
    {
      title: 'Maps that miss your community',
      body: 'Official street data ends where the favela begins. Roads, staircases, and the bakery on the corner — none of it is on the map.',

    },

      title: 'Earn MapCoins, redeem locally',
      body: 'Verified contributions earn coins. Spend them at neighborhood partners — bakeries, mercados, farmácias.',
      art: 'coins',
    },
  ];
  const s = slides[step];

  return (
    <div style={{ position: 'absolute', inset: 0, background: C.bg, display: 'flex', flexDirection: 'column' }}>
      <div style={{ paddingTop: 60, paddingLeft: 16, paddingRight: 16, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

      </div>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '20px 24px' }}>
        <OnboardingArt kind={s.art} />
        <h1 style={{ fontSize: 26, fontWeight: 800, color: C.text, margin: '40px 0 12px', textAlign: 'center', lineHeight: 1.2, textWrap: 'balance' }}>{s.title}</h1>
        <p style={{ fontSize: 15, color: C.textMuted, textAlign: 'center', lineHeight: 1.5, margin: 0, textWrap: 'pretty' }}>{s.body}</p>
      </div>

      <div style={{ padding: '0 24px 40px' }}>
        {/* dots */}
        <div style={{ display: 'flex', justifyContent: 'center', gap: 6, marginBottom: 22 }}>
          {slides.map((_, i) => (
            <div key={i} style={{
              width: i === step ? 22 : 7, height: 7, borderRadius: 7,
              background: i === step ? C.primary : C.borderStrong,
              transition: 'all 240ms',
            }} />
          ))}
        </div>
        <button onClick={() => step < slides.length - 1 ? setStep(step + 1) : onDone()} style={{
          width: '100%', minHeight: 54, borderRadius: 14,
          background: C.primary, color: '#fff', border: 'none',

          <div style={{ textAlign: 'center', marginTop: 14 }}>
            <button style={{ background: 'none', border: 'none', color: C.primary, fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>I already have an account</button>
          </div>
        )}
      </div>
    </div>
  );
}

function OnboardingArt({ kind }) {
  // Common: a tiny stylized map with mapped parcels + gray unmapped blob
  const blob = 'M 90 30 C 130 20, 170 30, 180 60 C 190 90, 175 120, 160 140 C 140 160, 110 160, 90 145 C 70 130, 60 110, 65 85 C 70 60, 70 40, 90 30 Z';
  const parcels = [
    [20,20],[40,18],[58,22],[210,24],[225,40],[220,60],
    [22,50],[20,72],[24,96],[18,118],[22,140],[40,150],[60,154],
    [220,90],[222,110],[218,130],[200,148],[180,154],[155,158],
    [80,160],[100,164],[120,162],[135,160],
  ];
  if (kind === 'broken') {
    // The broken / unmapped state — gray blob dominates, parcels around edges
    return (
      <svg width="240" height="180" viewBox="0 0 240 180">
        <defs>
          <pattern id="obHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#C8C8C0" strokeWidth="1" />

        <rect width="240" height="180" fill={MAP_COLORS.bgSand} rx="16" />

        <path d="M 8 30 C 30 60, 8 100, 14 140 L 14 170" stroke={MAP_COLORS.highway} strokeWidth="4" fill="none" strokeLinecap="round" />
        <path d="M 230 25 C 220 60, 232 100, 226 140 L 226 170" stroke={MAP_COLORS.highwayEdge} strokeWidth="6" fill="none" strokeLinecap="round" />
        <path d="M 230 25 C 220 60, 232 100, 226 140 L 226 170" stroke={MAP_COLORS.highway} strokeWidth="4" fill="none" strokeLinecap="round" />
        {/* Mapped parcels around edges */}
        {parcels.map(([x,y], i) => (
          <rect key={i} x={x} y={y} width="11" height="9" fill="#fff" stroke={MAP_COLORS.blockOutline} strokeWidth="0.5" rx="1" />
        ))}
        {/* Central GRAY unmapped blob */}
        <path d={blob} fill="url(#obHatch)" />

  if (kind === 'mapping') {
    // Active mapping state — community paths drawn into the gray area
    return (
      <svg width="240" height="180" viewBox="0 0 240 180">
        <defs>
          <pattern id="obHatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#C8C8C0" strokeWidth="1" />

        <rect width="240" height="180" fill={MAP_COLORS.bgSand} rx="16" />
        {/* Yellow highway */}
        <path d="M 8 30 C 30 60, 8 100, 14 140 L 14 170" stroke={MAP_COLORS.highwayEdge} strokeWidth="6" fill="none" strokeLinecap="round" />
        <path d="M 8 30 C 30 60, 8 100, 14 140 L 14 170" stroke={MAP_COLORS.highway} strokeWidth="4" fill="none" strokeLinecap="round" />
        <path d="M 230 25 C 220 60, 232 100, 226 140 L 226 170" stroke={MAP_COLORS.highwayEdge} strokeWidth="6" fill="none" strokeLinecap="round" />
        <path d="M 230 25 C 220 60, 232 100, 226 140 L 226 170" stroke={MAP_COLORS.highway} strokeWidth="4" fill="none" strokeLinecap="round" />
        {parcels.map(([x,y], i) => (
          <rect key={i} x={x} y={y} width="11" height="9" fill="#fff" stroke={MAP_COLORS.blockOutline} strokeWidth="0.5" rx="1" />
        ))}
        {/* Gray unmapped — but with community-drawn roads on top */}
        <path d={blob} fill="url(#obHatch2)" />
        <path d={blob} fill={MAP_COLORS.unmapped} opacity="0.4" />
        <path d={blob} fill="none" stroke={MAP_COLORS.unmappedEdge} strokeWidth="1" strokeDasharray="2 3" />
        {/* Roads in 3 statuses */}
        <path d="M 90 50 C 110 70, 130 90, 150 110" stroke={C.primary} strokeWidth="2.5" fill="none" strokeLinecap="round" />
        <path d="M 75 100 C 100 100, 130 110, 165 100" stroke={C.red} strokeWidth="2.5" fill="none" strokeLinecap="round" />
        <path d="M 100 130 L 130 145" stroke={C.orange} strokeWidth="2" fill="none" strokeDasharray="3 3" strokeLinecap="round" />
        {/* Pin */}
        <g transform="translate(120, 90)">
          <circle r="14" fill={C.primary} opacity="0.18" />
          <circle r="6" fill={C.primary} stroke="#fff" strokeWidth="2" />
        </g>
        {/* Business pin */}
        <g transform="translate(150, 70)">
          <path d="M 0 -10 C -5 -10, -5 -3, 0 2 C 5 -3, 5 -10, 0 -10 Z" fill={MAP_COLORS.business} stroke="#fff" strokeWidth="1" />
        </g>
      </svg>
    );
  }
  // Rewards state — coins floating over the now-mapped area
  return (
    <svg width="240" height="180" viewBox="0 0 240 180">
      <defs>
        <pattern id="obHatch3" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="#C8C8C0" strokeWidth="1" />
        </pattern>
      </defs>
      <rect width="240" height="180" fill={MAP_COLORS.bgSand} rx="16" />
      <path d="M 8 30 C 30 60, 8 100, 14 140 L 14 170" stroke={MAP_COLORS.highwayEdge} strokeWidth="6" fill="none" strokeLinecap="round" />
      <path d="M 8 30 C 30 60, 8 100, 14 140 L 14 170" stroke={MAP_COLORS.highway} strokeWidth="4" fill="none" strokeLinecap="round" />
      <path d="M 230 25 C 220 60, 232 100, 226 140 L 226 170" stroke={MAP_COLORS.highwayEdge} strokeWidth="6" fill="none" strokeLinecap="round" />
      <path d="M 230 25 C 220 60, 232 100, 226 140 L 226 170" stroke={MAP_COLORS.highway} strokeWidth="4" fill="none" strokeLinecap="round" />
      {parcels.map(([x,y], i) => (
        <rect key={i} x={x} y={y} width="11" height="9" fill="#fff" stroke={MAP_COLORS.blockOutline} strokeWidth="0.5" rx="1" opacity="0.7" />
      ))}
      <path d={blob} fill="url(#obHatch3)" opacity="0.5" />
      <path d={blob} fill={MAP_COLORS.unmapped} opacity="0.3" />
      <g transform="translate(120, 90)">
        <circle r="44" fill={C.gold} opacity="0.22" />
        <circle r="30" fill={C.gold} />
        <circle r="30" fill="none" stroke={C.primaryDark} strokeWidth="2.5" opacity="0.4" />
        <text textAnchor="middle" y="7" fontFamily="Inter, sans-serif" fontSize="20" fontWeight="800" fill={C.primaryDark}>★</text>
      </g>
      <text x="120" y="158" textAnchor="middle" fontFamily="Inter" fontSize="10" fontWeight="700" fill={C.primary} letterSpacing="2">MAPCOINS</text>
    </svg>
  );
}

Object.assign(window, { CreditsView, ProfileView, BusinessView, OnboardingView });

// ===== app.jsx =====
// app.jsx — Main app shell with navigation, tweaks, live phone

// (Starter components are now inlined directly above — no aliases needed)

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "intensity": 1.0,
  "density": 1.0,
  "showLiveReports": true,
  "compactList": false,
  "darkChrome": false
}/*EDITMODE-END*/;

const BADGE_DEFS = [
  { name: 'First Report', glyph: '★', check: cs => cs.length >= 1 },
  { name: 'Local Expert', glyph: '◆', check: cs => cs.length >= 3 },
  { name: '10 Streets',   glyph: '⬢', check: cs => cs.filter(c => c.type === 'road').length >= 2 },
  { name: '50 Confirms',  glyph: '✓', check: cs => cs.filter(c => c.status === 'verified').length >= 5 },
];

function PhoneApp({ initialScreen = 'onboarding', tweaks }) {
  const [screen, setScreen] = React.useState(initialScreen);
  const [stack, setStack] = React.useState([]);
  const [coins, setCoins] = React.useState(47);
  const [toast, setToast] = React.useState(null);
  const [pickedBusiness, setPickedBusiness] = React.useState(null);
  const [recentReports, setRecentReports] = React.useState([
    { id: 'rr1', x: 540, y: 420, color: '#C0392B', label: 'Blocked road', time: '3h ago' },
    { id: 'rr2', x: 220, y: 880, color: '#2E7D45', label: 'Passable road', time: '5h ago' },
  ]);
  const [contributions, setContributions] = React.useState([
    { id: 1, type: 'road',     icon: Icon.Flag,   name: 'R. Pasquale Galuppi', title: 'Reported blocked road',      sub: 'Rua das Flores · 3h ago',       coins: 5, status: 'verified' },
    { id: 2, type: 'business', icon: Icon.Shop,   name: 'Padaria Sonho',       title: 'Added business',             sub: 'Padaria Sonho · yesterday',      coins: 8, status: 'verified' },
    { id: 3, type: 'stair',    icon: Icon.Stairs, name: 'Escadaria Central',   title: 'Updated stair condition',    sub: 'Escadaria Central · 2 days ago', coins: 3, status: 'verified' },
    { id: 4, type: 'road',     icon: Icon.Road,   name: 'R. da Paz',           title: 'Confirmed passable',         sub: 'R. da Paz · 4 days ago',         coins: 2, status: 'verified' },
    { id: 5, type: 'business', icon: Icon.Shop,   name: 'Salão Beleza Pura',   title: 'Updated hours',              sub: 'Salão Beleza Pura · 1 wk ago',   coins: 4, status: 'flagged' },
  ]);

  const [earnedBadges, setEarnedBadges] = React.useState(
    () => new Set(BADGE_DEFS.filter(b => b.check([
      { id:1,type:'road',status:'verified'},{id:2,type:'business',status:'verified'},
      {id:3,type:'stair',status:'verified'},{id:4,type:'road',status:'verified'},
      {id:5,type:'business',status:'flagged'}
    ])).map(b => b.name))
  );

  React.useEffect(() => {
    BADGE_DEFS.forEach(b => {
      if (!earnedBadges.has(b.name) && b.check(contributions)) {
        setEarnedBadges(prev => new Set([...prev, b.name]));
        showToast(`Badge unlocked: ${b.name} ${b.glyph}`);
      }
    });
  }, [contributions]);

  // Simulate live new reports
  React.useEffect(() => {
    if (!tweaks.showLiveReports) return;
    const SIM_REPORTS = [
      { color: '#C0392B', label: 'Blocked road' },
      { color: '#2E7D45', label: 'Passable road' },
      { color: '#D97A2B', label: 'Foot traffic only' },
      { color: '#2E7D45', label: 'New business' },
      { color: '#D97A2B', label: 'Staircase update' },
    ];
    const i = setInterval(() => {
      setRecentReports((prev) => {
        const next = [...prev];
        if (next.length > 4) next.shift();
        const pick = SIM_REPORTS[Math.floor(Math.random() * SIM_REPORTS.length)];
        next.push({
          id: 'rr' + Date.now(),
          x: 150 + Math.random() * 700,
          y: 200 + Math.random() * 1200,
          color: pick.color,
          label: pick.label,
          time: 'just now',
        });
        return next;
      });
    }, 4500);
    return () => clearInterval(i);
  }, [tweaks.showLiveReports]);

  const showToast = (text) => {
    setToast(text);
    setTimeout(() => setToast(null), 2400);
  };

  const handleSubmit = ({ type, condition, businessName }) => {
    const iconMap = { road: Icon.Road, stair: Icon.Stairs, business: Icon.Shop };
    const titleMap = {
      road: `Reported ${condition ? condition + ' road' : 'road condition'}`,
      stair: 'Reported staircase condition',
      business: `Added business: ${businessName || 'Unknown'}`,
    };
    const condColor = { blocked: '#C0392B', passable: '#2E7D45', foot: '#D97A2B' };
    const pulseColor = type === 'business' ? '#2E7D45' : (condColor[condition] || '#2E7D45');
    const pulseLabel = type === 'business' ? `New business: ${businessName || 'Unknown'}` : titleMap[type];
    const name = type === 'business' ? (businessName || 'Unknown') : 'R. Pasquale Galuppi';
    const entryId = Date.now();
    const newEntry = {
      id: entryId,
      type: type || 'road',
      icon: iconMap[type] || Icon.Flag,
      name,
      title: titleMap[type] || 'New report',
      sub: `${name} · just now`,
      coins: 5,
      status: 'pending',
    };
    setContributions((prev) => [newEntry, ...prev]);
    setRecentReports((prev) => {
      const next = [...prev];
      if (next.length > 4) next.shift();
      next.push({ id: 'rr' + entryId, x: 510 + Math.random() * 60, y: 790 + Math.random() * 60, color: pulseColor, label: pulseLabel, time: 'just now' });
      return next;
    });
    setCoins((c) => c + 5);
    setScreen('credits');
    showToast('+5 MapCoins earned');
    setTimeout(() => {
      setContributions((prev) => prev.map((c) => c.id === entryId ? { ...c, status: 'verified' } : c));
      showToast('Report verified ✓');
    }, 8000);
  };

  const goBusiness = (b) => {
    setPickedBusiness(b);
    setStack((s) => [...s, screen]);
    setScreen('business');
  };

  const handleNavChange = (id) => {
    if (id === 'report') setScreen('report');
    else setScreen(id);
  };

  const showBottomNav = ['map', 'credits', 'profile'].includes(screen);

  return (
    <div style={{ position: 'absolute', inset: 0, background: '#fff', overflow: 'hidden', fontFamily: 'Inter, system-ui, sans-serif', color: C.text }}>
      {screen === 'onboarding' && (
        <OnboardingView onDone={() => setScreen('map')} />
      )}
      {screen === 'map' && (
        <MapView
          onOpenBusiness={goBusiness}
          onOpenReport={() => setScreen('report')}
          onOpenProfile={() => setScreen('profile')}
          recentReports={tweaks.showLiveReports ? recentReports : []}
          density={tweaks.density}
        />
      )}
      {screen === 'report' && (
        <ReportView
          onClose={() => setScreen('map')}
          onSubmit={handleSubmit}
        />
      )}
      {screen === 'credits' && <CreditsView coins={coins} contributions={contributions} onSpend={n => setCoins(c => c - n)} />}
      {screen === 'profile' && <ProfileView contributions={contributions} coins={coins} earnedBadges={earnedBadges} />}
      {screen === 'business' && (
        <BusinessView
          business={pickedBusiness}
          onBack={() => {
            const prev = stack[stack.length - 1] || 'map';
            setStack((s) => s.slice(0, -1));
            setScreen(prev);
          }}
          onReport={handleSubmit}
        />
      )}

      <Toast visible={!!toast} text={toast || ''} />

      {showBottomNav && <BottomNav active={screen} onChange={handleNavChange} />}
    </div>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Scale the phone to fit the viewport height with some padding
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const PHONE_W = 402, PHONE_H = 874;
    const update = () => {
      const scaleH = (window.innerHeight - 32) / PHONE_H;
      const scaleW = (window.innerWidth - 32) / PHONE_W;
      setScale(Math.min(scaleH, scaleW, 1));
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);

  return (
    <div style={{
      width: '100vw', height: '100vh',
      background: '#ffffff',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: 'Inter, system-ui, sans-serif',
    }}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
        <IOSDevice width={402} height={874}>
          <PhoneApp tweaks={tweaks} />
        </IOSDevice>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Map" />
        <TweakSlider label="Color intensity" value={tweaks.intensity} min={0.4} max={1.6} step={0.1} unit="x" onChange={(v) => setTweak('intensity', v)} />
        <TweakSlider label="Block density" value={tweaks.density} min={0.5} max={1.2} step={0.1} unit="x" onChange={(v) => setTweak('density', v)} />
        <TweakToggle label="Live reports" value={tweaks.showLiveReports} onChange={(v) => setTweak('showLiveReports', v)} />
        <TweakSection label="UI" />
        <TweakToggle label="Compact lists" value={tweaks.compactList} onChange={(v) => setTweak('compactList', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
